# Declarative creation of the service account used by agent-app.service.
#
#   sudo cp deploy/agent-app.sysusers.conf /etc/sysusers.d/agent-app.conf
#   sudo systemd-sysusers
#
# Creates the system user AND the matching group, with no home and no shell.
#Type Name       ID  GECOS               Home          Shell
u     agent-app  -   "Agent chat app"    /opt/agent-app /usr/sbin/nologin
