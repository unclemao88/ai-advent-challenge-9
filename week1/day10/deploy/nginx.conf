# Optional reverse proxy for deepseek-app-day10 (127.0.0.1:3009).
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/deepseek-app-day10
#   sudo ln -s /etc/nginx/sites-available/deepseek-app-day10 /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# There is no authentication in the app. If this is reachable from the internet,
# add auth_basic (or restrict by IP) in the location block below.

upstream deepseek_app_day10 {
    server 127.0.0.1:3009;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    access_log /var/log/nginx/deepseek-app-day10.access.log;
    error_log  /var/log/nginx/deepseek-app-day10.error.log;

    # The app accepts JSON bodies up to 64 KB (questions up to 8000 characters).
    client_max_body_size 64k;

    location / {
        proxy_pass http://deepseek_app_day10;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A Sticky-facts turn can make several DeepSeek calls (fact catch-up,
        # the answer, fact update), each capped by DEEPSEEK_TIMEOUT_MS (60s).
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
