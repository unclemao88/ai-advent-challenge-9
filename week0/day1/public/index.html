<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepSeek Query</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 720px;">
    <h1 class="h3 mb-4">Ask DeepSeek</h1>

    <form id="query-form">
      <div class="mb-3">
        <label for="prompt" class="form-label">Your query</label>
        <textarea class="form-control" id="prompt" rows="4" placeholder="Type your question..." autofocus></textarea>
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn" disabled>
        <span class="spinner-border spinner-border-sm d-none" id="spinner" role="status" aria-hidden="true"></span>
        <span id="submit-label">Submit</span>
      </button>
    </form>

    <div id="output" class="card mt-4 d-none">
      <div class="card-header">Response</div>
      <div class="card-body">
        <p class="card-text mb-0" id="output-text" style="white-space: pre-wrap;"></p>
      </div>
    </div>

    <div id="error" class="alert alert-danger mt-4 d-none" role="alert"></div>
  </div>

  <script>
    (function () {
      var form = document.getElementById('query-form');
      var promptEl = document.getElementById('prompt');
      var btn = document.getElementById('submit-btn');
      var spinner = document.getElementById('spinner');
      var label = document.getElementById('submit-label');
      var output = document.getElementById('output');
      var outputText = document.getElementById('output-text');
      var errorBox = document.getElementById('error');

      var isLoading = false;

      function syncButton() {
        btn.disabled = isLoading || !promptEl.value.trim();
      }

      function setLoading(loading) {
        isLoading = loading;
        spinner.classList.toggle('d-none', !loading);
        label.textContent = loading ? ' Thinking...' : 'Submit';
        syncButton();
      }

      promptEl.addEventListener('input', syncButton);
      syncButton();

      var HINTS = {
        413: 'The prompt was too large for the proxy.',
        502: 'The app behind the proxy is not responding — check that the service is running.',
        503: 'The app behind the proxy is unavailable.',
        504: 'The request timed out at the proxy before the model answered.'
      };

      function showError(message) {
        errorBox.textContent = message;
        errorBox.classList.remove('d-none');
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        var prompt = promptEl.value.trim();
        output.classList.add('d-none');
        errorBox.classList.add('d-none');

        setLoading(true);

        fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: prompt })
        })
          .then(function (res) {
            // A proxy in front of the app (nginx 502/504, or a gateway) answers
            // with an HTML error page, not JSON — so read text and parse defensively.
            return res.text().then(function (body) {
              var data = null;
              try {
                data = JSON.parse(body);
              } catch (e) { /* not JSON; handled below */ }
              return { ok: res.ok, status: res.status, statusText: res.statusText, data: data, body: body };
            });
          })
          .then(function (result) {
            if (result.data && typeof result.data.answer === 'string') {
              outputText.textContent = result.data.answer;
              output.classList.remove('d-none');
              return;
            }
            if (result.data && result.data.error) throw new Error(result.data.error);

            var label = 'HTTP ' + result.status + (result.statusText ? ' ' + result.statusText : '');
            var hint = HINTS[result.status];
            throw new Error(
              'The server did not return a valid response (' + label + ').' +
              (hint ? ' ' + hint : '')
            );
          })
          .catch(function (err) {
            showError(err.message);
          })
          .then(function () {
            setLoading(false);
          });
      });
    })();
  </script>
</body>
</html>
