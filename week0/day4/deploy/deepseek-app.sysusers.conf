# Declarative creation of the service account used by deepseek-app.service.
#
#   sudo cp deploy/deepseek-app.sysusers.conf /etc/sysusers.d/deepseek-app.conf
#   sudo systemd-sysusers
#
# Creates the system user AND the matching group, with no home and no shell.
#Type Name          ID  GECOS                  Home             Shell
u     deepseek-app  -   "DeepSeek query app"   /opt/deepseek-app /usr/sbin/nologin
