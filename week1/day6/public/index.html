<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask the Agent</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5" style="max-width: 680px;">
    <h1 class="h3 mb-4">Ask the Agent</h1>

    <form id="ask-form" novalidate>
      <div class="mb-3">
        <label for="question" class="form-label">Your question</label>
        <textarea class="form-control" id="question" rows="3"
                  placeholder="Type your question, then press Enter or click Ask" autofocus></textarea>
      </div>

      <button type="submit" class="btn btn-primary" id="ask-btn" disabled>
        <span class="spinner-border spinner-border-sm d-none" id="spinner" role="status" aria-hidden="true"></span>
        <span id="ask-label">Ask</span>
      </button>
    </form>

    <div id="error" class="alert alert-danger mt-4 d-none" role="alert"></div>

    <section class="mt-4" aria-labelledby="response-heading">
      <h2 class="h6 text-body-secondary" id="response-heading">Response</h2>
      <div class="card">
        <div class="card-body">
          <p class="card-text mb-0" id="response-body" aria-live="polite"
             style="white-space: pre-wrap; word-break: break-word;"></p>
        </div>
      </div>
    </section>
  </main>

  <script src="agent.js"></script>
  <script src="app.js"></script>
</body>
</html>
