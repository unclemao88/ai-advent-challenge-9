# Declarative creation of the service account used by deepseek-agent.service.
#
#   sudo cp deploy/deepseek-agent.sysusers.conf /etc/sysusers.d/deepseek-agent.conf
#   sudo systemd-sysusers
#
# Creates the system user AND the matching group, with no home and no shell.
#Type Name            ID  GECOS                  Home                 Shell
u     deepseek-agent  -   "DeepSeek chat agent"  /opt/deepseek-agent  /usr/sbin/nologin
