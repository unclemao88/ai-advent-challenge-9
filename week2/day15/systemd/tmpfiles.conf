# Installed as /etc/tmpfiles.d/deepseek-app-day15.conf by scripts/install-service.sh.
#
# systemd-tmpfiles creates this directory before the services start at boot, so
# the agent's data directory exists even if it was removed, and the unit's
# ReadWritePaths= can be mounted. Existing data is never modified: "d" only
# creates what is missing and fixes the mode and owner of the directory itself.
#
# Apply by hand:  sudo systemd-tmpfiles --create /etc/tmpfiles.d/deepseek-app-day15.conf
#
#Type Path                               Mode Owner        Group        Age
d     /opt/deepseek-app-day15/data       0700 deepseek-app deepseek-app -
