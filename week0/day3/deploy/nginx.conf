# /etc/nginx/sites-available/deepseek-app
# Enable with:
#   ln -s /etc/nginx/sites-available/deepseek-app /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# For TLS, run `certbot --nginx -d example.com` after this is in place — it
# rewrites this block to listen on 443 and adds the HTTP->HTTPS redirect.

upstream deepseek_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    access_log /var/log/nginx/deepseek-app.access.log;
    error_log  /var/log/nginx/deepseek-app.error.log;

    # Prompts are small; keep uploads bounded (the app caps bodies at 1 MB too).
    client_max_body_size 256k;

    location / {
        proxy_pass http://deepseek_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A DeepSeek completion can take a while; the app's own timeout is 120s,
        # so give nginx a little more headroom than that.
        proxy_connect_timeout 10s;
        proxy_send_timeout    130s;
        proxy_read_timeout    130s;

        # Deliver the answer as soon as the app produces it.
        proxy_buffering off;
    }
}
