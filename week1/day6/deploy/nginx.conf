# /etc/nginx/sites-available/agent-app
# Enable with:
#   ln -s /etc/nginx/sites-available/agent-app /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# For TLS, run `certbot --nginx -d example.com` after this is in place — it
# rewrites this block to listen on 443 and adds the HTTP->HTTPS redirect.

upstream agent_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    access_log /var/log/nginx/agent-app.access.log;
    error_log  /var/log/nginx/agent-app.error.log;

    # Questions are small; keep uploads bounded (the app caps bodies at 64 KB too).
    client_max_body_size 128k;

    location / {
        proxy_pass http://agent_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The agent's own timeout is 60s (AGENT_TIMEOUT_MS); give nginx headroom
        # so the agent's error message reaches the browser instead of a 504.
        proxy_connect_timeout 10s;
        proxy_send_timeout    70s;
        proxy_read_timeout    70s;

        # Deliver the answer as soon as the app produces it.
        proxy_buffering off;
    }
}
