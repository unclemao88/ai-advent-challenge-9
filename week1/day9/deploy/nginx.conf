# /etc/nginx/sites-available/deepseek-app-day9
#
#   sudo ln -s /etc/nginx/sites-available/deepseek-app-day9 /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# For TLS: sudo certbot --nginx -d example.com
# There is no authentication in the app. If this is reachable from the internet,
# add auth_basic (or restrict by IP) in the location block below.

upstream deepseek_app_day9 {
    server 127.0.0.1:3008;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    access_log /var/log/nginx/deepseek-app-day9.access.log;
    error_log  /var/log/nginx/deepseek-app-day9.error.log;

    # The app accepts JSON bodies up to 64 KB (questions up to 8000 characters).
    client_max_body_size 64k;

    location / {
        proxy_pass http://deepseek_app_day9;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # One question can take up to three DeepSeek calls (summary catch-up,
        # the answer, the summary update), each capped by DEEPSEEK_TIMEOUT_MS
        # (60s). Give nginx room so the app's own error reaches the browser.
        proxy_connect_timeout 10s;
        proxy_send_timeout    200s;
        proxy_read_timeout    200s;
    }
}
