# /etc/nginx/sites-available/deepseek-agent
# Enable with:
#   ln -s /etc/nginx/sites-available/deepseek-agent /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# For TLS, run `certbot --nginx -d example.com` after this is in place — it
# rewrites this block to listen on 443 and adds the HTTP->HTTPS redirect.

upstream deepseek_agent {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    access_log /var/log/nginx/deepseek-agent.access.log;
    error_log  /var/log/nginx/deepseek-agent.error.log;

    # Questions are small; keep uploads bounded (the app caps bodies at 128 KB
    # and the question itself at 8000 characters).
    client_max_body_size 128k;

    location / {
        proxy_pass http://deepseek_agent;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The agent's own timeout is 60s (DEEPSEEK_TIMEOUT_MS); give nginx
        # headroom so the agent's error message reaches the browser instead of
        # a 504. Replaying a long history makes slow answers likelier here than
        # in the stateless apps.
        proxy_connect_timeout 10s;
        proxy_send_timeout    70s;
        proxy_read_timeout    70s;

        # Deliver the answer as soon as the app produces it.
        proxy_buffering off;
    }
}
